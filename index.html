<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070a10">
  <title>Modern Embossed Buttons</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="topbar">
      <h1>MODERN EMBOSSED BUTTON</h1>
    </header>

    <section class="button-gallery" aria-label="Modern animated embossed button styles">
      <article class="demo cyan">
        <h2>CYAN PULSE</h2>
        <p>Electric glow + embossed depth</p>
        <button class="orb-button" type="button" aria-label="Start">
          <span class="orbit orbit-one"></span>
          <span class="orbit orbit-two"></span>
          <span class="core"><span class="symbol">ϟ</span></span>
          <span class="button-label">START</span>
        </button>
      </article>

      <article class="demo purple">
        <h2>PURPLE ORBIT</h2>
        <p>Rotating energy ring animation</p>
        <button class="orb-button" type="button" aria-label="Future">
          <span class="orbit orbit-one"></span>
          <span class="orbit orbit-two"></span>
          <span class="core"><span class="symbol">✦</span></span>
          <span class="button-label">FUTURE</span>
        </button>
      </article>

      <article class="demo red">
        <h2>RED ENERGY</h2>
        <p>Fast electric rotation effect</p>
        <button class="orb-button" type="button" aria-label="Power">
          <span class="orbit orbit-one"></span>
          <span class="orbit orbit-two"></span>
          <span class="core"><span class="symbol">◉</span></span>
          <span class="button-label">POWER</span>
        </button>
      </article>

      <article class="demo green">
        <h2>MATRIX GREEN</h2>
        <p>Cyber-style neon interaction</p>
        <button class="orb-button" type="button" aria-label="Enter">
          <span class="orbit orbit-one"></span>
          <span class="orbit orbit-two"></span>
          <span class="core"><span class="symbol">›</span></span>
          <span class="button-label">ENTER</span>
        </button>
      </article>

      <article class="demo rgb">
        <h2>RGB ELECTRIC</h2>
        <p>Multi-color futuristic animation</p>
        <button class="orb-button" type="button" aria-label="Create">
          <span class="orbit orbit-one"></span>
          <span class="orbit orbit-two"></span>
          <span class="core"><span class="symbol">◇</span></span>
          <span class="button-label">CREATE</span>
        </button>
      </article>
    </section>

    <p class="interaction-hint">Click any button to trigger its energy pulse</p>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>
  <script src="script.js"></script>
</body>
</html>
